<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>GlslCanvas</title>
  <script type="text/javascript"
    src="https://rawgit.com/patriciogonzalezvivo/glslCanvas/master/dist/GlslCanvas.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 避免出現捲軸 */
    }

    body {
      background: #101515;
    }

    #glslCanvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      /* aspect-ratio: 5712 / 4284; */
      aspect-ratio: 4 / 3;
    }
  </style>
</head>

<body>
  <canvas id="glslCanvas" data-fragment-url="shaders/GeneticImage-house.frag" width="800" height="600"
    data-textures="data/wave_wave.jpg"></canvas>
</body>
<script>
  var canvas = document.getElementById("glslCanvas");
  var sandbox = new GlslCanvas(canvas);
  function updateGridSize() {
    // 設定每個格子大約佔用的像素大小 (例如 15px)
    // 數值越小，格子越密；數值越大，格子越大
    var cellPixelSize = .1;

    // 根據畫布寬度計算 grid size (代表寬度方向有多少格)
    // 使用 canvas.clientWidth 確保取得實際顯示寬度
    var gridSize = canvas.clientWidth / cellPixelSize;

    // 將計算結果傳送給 Shader 中的 uniform float u_grid_size
    sandbox.setUniform("u_grid_size", gridSize);
  }
  setTimeout(updateGridSize, 100);
  window.addEventListener('resize', function () {
    updateGridSize();
  });
  // canvas.style.width = '100%';
  // canvas.style.height = '100%';
</script>

</html>
