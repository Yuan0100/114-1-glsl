<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Camouflage Hybrid Download</title>
  <script type="text/javascript"
    src="https://rawgit.com/patriciogonzalezvivo/glslCanvas/master/dist/GlslCanvas.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 避免出現捲軸 */
    }

    body {
      background: #101515;
    }

    #glslCanvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* width: 100%; */
      height: 100%;
      /* 移除 CSS 中的 aspect-ratio，改由 JS 動態設定 */
    }
  </style>
</head>

<body>
  <!-- 移除 width, height 和 data-textures，改由 JS 控制 -->
  <canvas id="glslCanvas" data-fragment-url="shaders/Camouflage-season.frag"></canvas>
</body>
<script>
  var canvas = document.getElementById("glslCanvas");
  var sandbox;

  // --- 設定圖片路徑 ---
  var imgUrl = "data/camouflage/formosan_clouded_leopard.png";
  var depthUrl = "data/camouflage/formosan_clouded_leopard-depth.png";

  // 1. 建立 Image 物件來預先載入圖片
  var img = new Image();

  img.onload = function () {
    // 圖片載入完成後執行：

    // 設定 Canvas 解析度為圖片原始尺寸 (Buffer Size)
    canvas.width = this.naturalWidth;
    canvas.height = this.naturalHeight;

    // 設定 CSS aspect-ratio 以維持正確顯示比例 (Display Ratio)
    canvas.style.aspectRatio = this.naturalWidth + " / " + this.naturalHeight;

    // 設定 data-textures 屬性給 GlslCanvas 讀取
    canvas.setAttribute("data-textures", imgUrl);

    // 初始化 GlslCanvas
    initSandbox();
  };

  // 開始載入圖片
  img.src = imgUrl;

  function initSandbox() {
    // 加入 { preserveDrawingBuffer: true } 以確保能截圖
    sandbox = new GlslCanvas(canvas, {preserveDrawingBuffer: true});

    // 監聽 shader 載入完成事件，確保 Uniforms 在 Shader 編譯後才設定
    sandbox.on('load', function () {
      // 明確設定 u_texture 和 u_depth_texture
      sandbox.setUniform("u_texture", imgUrl);
      sandbox.setUniform("u_depth_texture", depthUrl);
      // 初始化 Uniforms
      updateUniforms();
    });

    // 初始化 GUI
    initGUI();
  }

  // --- GUI 控制項 ---
  var params = {
    season: 1.0,
    pixelDensity: 120.0,
    patternScale: 12.0,
    seed: 42.0,
    wContent: 0.9,
    wHidden: 0.1
  };

  function initGUI() {
    var gui = new dat.GUI();

    // 主要控制項 (Main Controls)
    gui.add(params, 'season', 1, 8).step(0.01).name('Season').onChange(updateUniforms);
    gui.add(params, 'wContent', 0.1, 0.9).name('Content Weight').onChange(updateUniforms);
    gui.add(params, 'wHidden', 0.1, 0.9).name('Hidden Weight').onChange(updateUniforms);

    // 進階設定 (Advanced Settings) - 預設收合
    var folder = gui.addFolder('Advanced Settings');
    folder.add(params, 'pixelDensity', 10, 200).name('Pixel Density').onChange(updateUniforms);
    folder.add(params, 'patternScale', 1, 20).name('Pattern Scale').onChange(updateUniforms);
    folder.add(params, 'seed', 0, 100).name('Random Seed').onChange(updateUniforms);
  }

  function updateUniforms() {
    sandbox.setUniform("u_season", params.season);
    sandbox.setUniform("u_pixel_density", params.pixelDensity);
    sandbox.setUniform("u_pattern_scale", params.patternScale);
    sandbox.setUniform("u_seed", params.seed);
    sandbox.setUniform("u_w_content", params.wContent);
    sandbox.setUniform("u_w_hidden", params.wHidden);
  }

  // --- 按 'S' 鍵儲存圖片 (非同步防當機版) ---
  function saveCanvas() {
    // 使用 toBlob 而非 toDataURL，避免大圖造成瀏覽器凍結
    canvas.toBlob(function (blob) {
      // 建立下載連結
      var link = document.createElement('a');
      var timestamp = new Date().toISOString().replace(/[:.]/g, "-");
      link.download = "camouflage-hybrid-" + timestamp + ".png";

      // 建立 Blob URL
      var url = URL.createObjectURL(blob);
      link.href = url;

      // 觸發下載
      document.body.appendChild(link);
      link.click();

      // 清理資源
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }, "image/png", 1.0); // 1.0 代表最高品質
  }

  window.addEventListener('keydown', function (e) {
    // 按下 's' 或 'S' 鍵時觸發
    if (e.key === 's' || e.key === 'S') {
      saveCanvas();
    }
  });
</script>

</html>
